[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "curldb"
version = "0.4.0"
description = "HTTP exchange datastore: raw requests and responses in, structured queries out. One SQLite file per session, zero daemon, zero dependencies."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ranger Chen", email = "ranger@rangerfoxsolutions.com" }]
requires-python = ">=3.10"
keywords = ["http", "sqlite", "archive", "llm", "front-matter", "fts5"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Database",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Text Processing :: Indexing",
]
dependencies = []

[project.urls]
Homepage = "https://curldb.ai"
Repository = "https://github.com/rangersui/curldb"

[project.scripts]
curldb = "curldb:cli"

[tool.setuptools]
py-modules = ["curldb"]
